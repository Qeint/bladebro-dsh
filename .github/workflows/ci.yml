name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: build + unit + pack-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        if: runner.os == 'Linux'
        id: chrome
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run pack-check
      - name: Live parity + real-registry contract proof on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xfwm4 x11-utils
          npm run live
          BLADEBRO_BIN="$(node -e "import('./dist/binary.js').then(m => process.stdout.write(m.binaryAt(process.argv[1])))" "$(node -e "import('./dist/version.js').then(m => process.stdout.write(m.PINNED_BLADEBRO_VERSION))")")"
          BLADEBRO_BIN="$BLADEBRO_BIN" node --test --test-concurrency=1 test/real-registry.test.mjs
        env:
          BLADEBRO_DSH_AUTOUPDATE: off
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          BLADE_CHROME_FLAGS: --no-sandbox
